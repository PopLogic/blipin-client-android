name: detekt

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

jobs:
  detekt:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download detekt
        run: |
          curl -sSL -o detekt-cli-all.jar https://github.com/detekt/detekt/releases/download/v1.23.8/detekt-cli-1.23.8-all.jar

      - name: Run detekt
        run: |
          java -jar detekt-cli-all.jar \
            --input app/src \
            --build-upon-default-config \
            --report sarif:build/reports/detekt/detekt.sarif \
            --report md:build/reports/detekt/detekt.md \
            --report github:build/reports/detekt/detekt-github.txt

      - name: Print detekt summary
        if: always()
        run: |
          echo "## Detekt Report" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/reports/detekt/detekt.md ]; then
            cat build/reports/detekt/detekt.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No markdown report generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: build/reports/detekt/

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build/reports/detekt/detekt.sarif