name: build-validation

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

jobs:
  build:
    name: Validate Compilability and Unit Tests
    runs-on:
      group: Blipin-Client
      labels: [ self-hosted ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Android SDK
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"

          if [[ ! -d "$sdk_root" ]]; then
            echo "Android SDK not found at: $sdk_root" >&2
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk_root/emulator" >> "$GITHUB_PATH"

          # Create local.properties before Gradle runs so the secrets-gradle-plugin
          # can evaluate the project without throwing "file not found".
          echo "sdk.dir=$sdk_root" > local.properties
          # Create secrets.properties (primary lookup file for the secrets plugin)
          # with a placeholder so the key resolves to an empty string in CI.
          touch secrets.properties

      - name: Clear Gradle configuration cache
        run: rm -rf .gradle/configuration-cache

      - name: Setup Map Api Key
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          # Write to secrets.properties — this is the primary file the
          # secrets-gradle-plugin looks for (propertiesFileName = "secrets.properties").
          # Writing here avoids the fallback-to-local.properties path entirely.
          echo "GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY" > secrets.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build developmentDebug
        run: ./gradlew assembleDevelopmentDebug testDevelopmentDebugUnitTest