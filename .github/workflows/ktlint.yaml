name: ktlint

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  ktlint:
    name: Kotlin lint
    runs-on:
      group: Blipin-Client
      labels: [ self-hosted ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Needed so pushes go back to the PR/source branch
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download ktlint
        run: |
          curl -sSLo ktlint https://github.com/pinterest/ktlint/releases/download/1.3.1/ktlint
          chmod +x ktlint

      - name: Apply ktlint fixes
        run: |
          ./ktlint -F "app/src/**/*.kt" "*.kts"

      - name: Generate ktlint markdown report
        if: always()
        run: |
          mkdir -p build/reports/ktlint
          ./ktlint "app/src/**/*.kt" "*.kts" \
            --reporter=markdown,output=build/reports/ktlint/ktlint.md

      - name: Commit and push fixes
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.fork == false
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: apply ktlint auto-fixes"
            git push
          else
            echo "No ktlint fixes to commit."
          fi

      - name: Upload ktlint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-report
          path: build/reports/ktlint/

      - name: Job summary
        if: always()
        run: |
          echo "## ktlint report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/reports/ktlint/ktlint.md ]; then
            cat build/reports/ktlint/ktlint.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report found." >> "$GITHUB_STEP_SUMMARY"
          fi